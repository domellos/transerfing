    <meta
      name="description"
      content="Nieoficjalny przewodnik po Transerfingu Vadima Zelanda: wahadła, ważność, zamiar, slajdy, techniki Tafti i wyjście z matrixa. Lekcje, program i narzędzia."

    <script>
      // Ustaw motyw przed załadowaniem aplikacji, żeby uniknąć mignięcia.

        if (s && s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
